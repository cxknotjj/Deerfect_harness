server:
  # 独立部署端口（与 harness server 的 8080 错开）
  port: 8090

spring:
  application:
    name: wms-mcp-adapter
  ai:
    mcp:
      server:
        # MCP Streamable HTTP 服务端（WebMVC 传输），与 harness server 模块同款配置方式：
        # protocol 必须显式置为 STREAMABLE 才会注册 /mcp 端点（默认是 SSE，端点不在 /mcp）
        name: wms-mcp-adapter
        enabled: true
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

wms:
  # WMS 服务根地址（如 http://wms.example.com:8080/jeecg-boot），零硬编码：留空则工具调用返回引导性错误
  api-base: ${WMS_API_BASE:}
  # WMS 只读账号 token（经环境变量注入，禁止写入代码或配置文件）
  api-token: ${WMS_API_TOKEN:}
  # WMS 鉴权头名称：OpenAPI 未声明鉴权方案，默认 jeecg 惯例 X-Access-Token，接入前与 WMS 方确认
  token-header: ${WMS_TOKEN_HEADER:X-Access-Token}
  # 调用方（harness）鉴权 token：非空启用 X-API-Token 头校验；留空 = 不启用（本地调试）
  mcp-token: ${WMS_MCP_TOKEN:}
