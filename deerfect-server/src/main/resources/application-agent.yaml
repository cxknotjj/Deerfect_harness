# ============================================================
# Agent 运行时：沙箱 / Prompt 装配 / 用户画像 / 观测清理
# 由 application.yaml 的 spring.config.import 引入，不依赖 profile 激活。
# ============================================================

app:
  # Agentic SIMPLE 路径（路径 A）：由 AgentScope ReActAgent 执行推理-行动循环；
  # 工具仍走 Spring AI（MCP/沙箱/自研工具经 ToolCallback 桥接），COMPLEX 编排路径不受影响。
  # enabled=false 时回退既有 ChatClient 单次调用路径。
  agentic:
    enabled: true
    max-iters: 5              # ReAct 最大迭代：工具调用上限 4 + 最终回答一轮
    max-attempts: 3           # 模型调用最大尝试次数（含首次）
    fallback-enabled: true    # AgentScope 初始化失败时回退 ChatClient 路径（流已开始后不切换）
  # 容器沙箱 Docker daemon 地址（host:port 或 tcp://host:port）：
  # SDK 默认发现只认 DOCKER_HOST 环境变量与 unix socket（/var/run/docker.sock）；
  # WSL/远程 daemon 等无 socket 场景用此项直连 TCP（如 Windows 宿主机 Docker Desktop
  # 暴露的 2375；镜像网络下用 127.0.0.1，勿用 localhost——IPv6 解析会超时）。
  # 留空 = 走 SDK 默认发现；环境变量 DOCKER_HOST 优先级更高（docker-java 标准链）。
  sandbox:
    docker-host: "127.0.0.1:2375"
    # 容器健康自愈：定时在 base 容器内 echo 探活，失败则销毁重建（工具面同步重生成）。
    # 无人值守任务下容器假死表现为「工具一直报错」，没有自愈只能重启应用。
    health-enabled: true
    # 探测间隔（毫秒，必须 > 0；关闭用 health-enabled=false，不要设 0）
    health-interval-ms: 300000
    # 启动时清理上次强杀进程遗留的容器（@PreDestroy 未执行）。
    # 前提是单实例部署：同一个 Docker daemon 上跑多个实例会互相清容器。
    cleanup-orphans-on-start: true
  # 定时任务扫描（agent_schedule 表）：到点把 objective 提交给指定 Agent（复用 goal 执行链）。
  # 单实例假设——扫描与推进同线程串行；多实例部署需要 ShedLock 或改消息队列。
  schedule:
    scan-interval-ms: 10000
  # 失败重投扫描：每 30 秒找 next_retry_at 到期的 FAILED goal 重新提交（同一条 goal，不新建）。
  # 退避 1→2 分钟，最多重投 2 次；watchdog 管「卡住不动」，这里管「失败再试一次」。
  goal:
    retry-scan-interval-ms: 30000
  # 工具 Schema 延迟加载（两段式工具暴露）：开启后请求级工具面轻量注入（名称+用途，schema 置空），
  # system 附工具索引段，模型经 expand_tool 元工具按需展开获取完整参数说明；
  # 关闭后回退全量注入现状（expand_tool 不注册）
  prompt:
    lazy-tools:
      enabled: true
    # skill 动态装配（Markdown 技能库）：扫描 dir 下的技能子目录（入口 SKILL.md 或 <目录名>.md，
    # front-matter 声明 name/description/agents），system 注入「名称+描述」索引段，模型经 load_skill
    # 元工具按需取完整正文；入口文件按 mtime+size 热重载（放入/修改下一请求生效，免重启）；
    # scan-cache-ms：单请求内索引段/名单/load_skill 共用一次目录扫描的短 TTL，0=每次重新扫描
    # 关闭后 skill 段为空、load_skill 不注册
    skills:
      enabled: true
      dir: skills
      scan-cache-ms: 200
      max-index-tokens: 0           # 索引段 token 上限，0=不限制；超出时截断并追加提示
  # 用户偏好画像（跨对话长期记忆）：后台定时扫描空闲会话，LLM 提炼偏好并合并进
  # 全局画像文件（Markdown 条目，全文注入 general/lead 的 system prompt 画像段）；
  # 关闭后画像服务与注入点均不装配，prompt 无画像段
  memory:
    profile-enabled: false                        # 总开关（UserProfileService / 注入点同开关装配）
    profile-file: user-profile/user-profile.md   # 画像文件（相对工作区顶层目录，容器整目录挂载避单文件 inode 陷阱）
    profile-scan-interval-ms: 900000           # 空闲会话扫描周期（5 分钟，fixedDelay 上一轮完成后间隔再跑，不堆叠）
    profile-idle-minutes: 30                     # 会话静默多久后视为可提炼（防活跃会话反复提取；存量会话不回溯）
    profile-max-chars: 4000                      # 画像合并后字符上限（超出尾截，控制常驻注入预算）
  # 渠道事件语义层判断（SemanticTriggerJudge）：QQ 事件经程序层标记为 candidate 后，
  # 由一次轻量 LLM 判断是否值得主动介入；默认关闭，关闭时候选事件一律忽略。
  trigger-judge:
    enabled: false
    model: qwen3.8-27b                         # 判断用模型（与 route-judge 同档轻量模型）
  # Goal 停滞看门狗（StaleGoalWatchdog）：定时扫描 RUNNING 且 last_progress_at 超过阈值的
  # 目标并条件更新为 FAILED；默认关闭，阈值必须大于 LLM 读超时与流空闲超时，
  # 建议先观察一轮实际进展间隔再开启。只标失败，不自动重投。
  watchdog:
    enabled: false
    stagnant-minutes: 30                         # 无进展判定阈值（分钟）
    scan-interval-ms: 60000                      # 扫描间隔（fixedDelay 上一轮结束后再跑，不堆叠）
  # 观测表保留期清理（ObservabilityLogCleaner）：llm_call_log / tool_call_log 按 created_at
  # 分批删除过期行（V24 索引支撑，单批 1000 防长事务）。0 = 禁用清理（不删任何行）
  observability:
    retention-days: 90                           # 观测数据保留天数
    clean-cron: "0 0 3 * * ?"                    # 清理时刻（每日凌晨 3 点低峰期）
  # 业务数据保留期：与观测日志分开配——归档是 recall_history 的数据源、goal 含 objective/summary
  # 正文，生命周期比「丢了不心疼」的日志长；0 = 禁用该表清理
  retention:
    archive-days: 180                            # 会话归档保留天数：超期按 archived_at 分批删除，
                                                 # 意味着 recall_history 只能查到期内数据
    goal-days: 180                               # 已结束（SUCCEEDED/FAILED）目标保留天数：
                                                 # 清理时级联删其编排检查点，PENDING/RUNNING 不动
    outbox-sent-days: 7                          # 已送达投递记录保留天数（审计窗口：够查
                                                 # 「上周那条日报发了没」）；0 = 禁用
    outbox-dead-days: 30                         # 投递失败（DEAD）记录保留天数；0 = 禁用
    clean-cron: "0 30 3 * * ?"                   # 清理时刻（错开观测清理的 03:00）

  # 主动投递：outbox 重投与降级链（V14）。单实例部署，这些参数只影响「重试节奏」，
  # 不涉及分布式协调
  delivery:
    scan-interval-ms: 30000                      # 扫描到期消息的节拍
    batch: 50                                    # 单轮最多领取条数
    lease-seconds: 60                            # 领取租约：发送中进程被杀时，到期后自动重试
    max-per-hop: 3                               # 单个通道最多尝试几次，用尽后换链上下一跳
    backoff-seconds: 60,180,600                  # 同通道重试退避（逗号分隔，按尝试次数取）
    long-text-threshold: 6000                    # 正文超此长度且有 email 时，把 email 提到链首
                                                 # （截断会丢信息，转邮件不丢）

  # 告警抑制：避免「每次失败发一条」把自己练成不看告警的人
  alert:
    min-failures: 3                              # 连续失败几次才发第一条（探活告警共用此阈值）
    throttle-hours: 24                           # 同类告警的抑制窗口

  # 渠道探活告警（ChannelWatchdog）：定时问各渠道「你还能用吗」，连续失败达阈值后通知。
  # 告警走 alert-chain 上「非本渠道」的那一段——不能用飞书报「飞书挂了」。
  # 只对「确认不可用」告警；邮件那种「7 天没投递 = 不知道」的状态不算故障。
  channel-watchdog:
    enabled: true
    interval-ms: 300000                          # 探活节拍；判定耗时 ≈ app.alert.min-failures × 本值
    alert-chain: ""                              # 例：email:me@example.com；留空则只记日志（不探活）
