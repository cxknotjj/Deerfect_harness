# 外部工具（app.tools.*）：声明式 HTTP —— 接一个新的 REST 系统只需放一份 yaml，
# 不改 Java、不改 ToolAssignments、不重打包。与 MCP 的分工：
#   MCP    = 第三方/多语言服务，工具面由对方决定
#   HTTP   = 自家接口，路径与参数被清单约束（模型只能选资源与参数值，不能自由出站）
app:
  tools:
    http:
      enabled: true
      dir: tools/http            # 相对启动工作目录；容器里挂载该目录即可热改
      # 外部文件是运维资产：一份写错不该让服务起不来，默认收集问题并在
      # /api/capabilities 暴露；需要严格门禁时打开（启动即失败）
      fail-fast: false
