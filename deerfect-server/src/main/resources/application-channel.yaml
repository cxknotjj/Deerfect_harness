# 渠道通用配置（非 QQ 专用渠道）
#
# QQ / NapCat 的配置在 application-qq.yaml（历史原因，前缀 napcat.*）。
# 这里的渠道统一用 channel.* 命名空间：与 core 的 app.* 分开，一眼能看出
# 「这是渠道模块自己的配置」，也不会误触 Spring Boot 的全局自动装配。

channel:
  # 邮件渠道（M1）：把定时任务结果 / 告警投到邮箱，也是长文的默认落点。
  # 全部可从环境变量覆盖（本地写 .env.local 后 `set -a; source .env.local; set +a`，
  # Docker 写 docker/.env）：CHANNEL_EMAIL_ENABLED / MAIL_HOST / MAIL_FROM /
  # MAIL_USERNAME / MAIL_PASSWORD。凭据只放环境变量，不落 git。
  email:
    enabled: ${CHANNEL_EMAIL_ENABLED:false}   # 未配 SMTP 就不装配：注册表里也不会出现 email 渠道
    host: ${MAIL_HOST:smtp.example.com}       # QQ 邮箱 smtp.qq.com / 阿里云 smtpdm.aliyun.com
    port: 465                          # 465 = SSL；当前实现不支持 587 STARTTLS
    from: "${MAIL_FROM:${MAIL_USERNAME:}}"    # 留空则与登录账号一致——多数服务商强制要求两者相同
    username: ${MAIL_USERNAME:}        # 环境变量注入，见 docs/dev.md 的「环境变量」一节
    password: ${MAIL_PASSWORD:}        # 授权码，不是登录密码；不得进 git
    ssl: true
    timeout-ms: 10000                  # 连接 / 读 / 写超时：SMTP 挂起时不能把投递线程按住太久

  # 飞书渠道（M3a）：群自定义机器人 webhook，单向推送。
  # 不需要建应用、申请权限、审核或公网回调；20 KB 上限由投递层自动转邮件。
  # URL 就是凭证（泄露即可被冒名发消息），所以 secret 必填、签名强制开启。
  feishu:
    enabled: ${CHANNEL_FEISHU_ENABLED:false}   # 未配 webhook 就不装配：注册表里也不会出现 feishu 渠道
    alias: main                        # notify_channel 写 feishu:main，业务表里不存 URL
    webhook-url: ${FEISHU_WEBHOOK_URL:}        # 群设置 → 群机器人 → 自定义机器人
    webhook-secret: ${FEISHU_WEBHOOK_SECRET:}  # 开启「签名校验」后飞书给的密钥；缺少则拒绝启动
    timeout-ms: 10000
    # 事件订阅（M3b 长连接）：与出站 webhook 独立开关。
    # 需要自建应用（App ID / Secret），不需要域名、不需要公网回调。
    ws:
      enabled: ${CHANNEL_FEISHU_WS_ENABLED:false}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      encrypt-key: ${FEISHU_ENCRYPT_KEY:}       # 控制台开启事件加密时才需要
      allowed-users: []                        # open_id 白名单；空 = 配对模式（只打印 open_id，不回复）
      # 指令授权：只有这个 open_id 能发 /new /help /history /agent（群里也生效）。
      # 留空则取 allowed-users 首位；指令能重置「这个人 + 这个群」的会话，不能放开给所有人
      command-user: ${FEISHU_WS_COMMAND_USER:}
      queue-capacity: 32                       # 入站有界队列；满了丢新消息并记 warn
      chat-timeout-seconds: 300                # 单条生成上限；超时放弃回复，会话记忆仍落库
      reply-max-chars: 3000                    # 回复正文上限（字符）；超长截断并标注，避免整条发不出去
      # 回复形态（群聊）：all 每条都回 / mention 只在 @ 时回 / probability 按概率回
      reply-mode: all
      reply-probability: 1.0                   # reply-mode=probability 时的放行概率
      at-asker: false                          # 群聊回复是否 @ 提问者
      quote-reply: true                        # 引用回复（挂到原消息下）；失败自动退回普通发送
      reply-in-thread: false                   # 引用是否走话题（thread）形式
      # 长任务回执：超过阈值仍未回复时给原消息贴一个表情，答完自动撤销。
      # 需要 im:message.reaction:write 权限；缺权限只 warn（且只提醒一次），不影响回复。
      receipt-reaction-enabled: true
      receipt-delay-ms: 3000
      receipt-emoji: OnIt
      # 表情包：模型在回复末尾输出 [emoji:分类]，渠道剥离标记后上传一张同类图片再发送。
      # 与 QQ 共用 emojis/ 数据（图片与索引都不进 git；索引缺失时自动创建空映射），
      # 配置键各自独立——渠道模块之间不能互相依赖。
      emoji:
        enabled: true
        dir: emojis
        index-file: emojis/emoji-index.json
        probability: 1.0
      # 语音回复：core 的 TTS 产出 mp3，飞书语音条只认 opus，需 ffmpeg 转码并取时长。
      # 运行环境没有 ffmpeg 时本条退回文字（只 warn 一次），不影响其它消息。
      voice:
        enabled: true
        ffmpeg: ffmpeg                            # PATH 里有就写 ffmpeg；容器里给绝对路径更稳
        timeout-seconds: 15                       # 转码超时：卡住的子进程必须杀掉
        bitrate: 32k                              # opus 码率：语音够用即可
        channels: 1                               # 语音单声道，体积减半
        # 音乐参数：曲库点播（play_music 写 format=music 的工件）走这一套。
        # 音乐是二次有损编码，32k 会明显发闷；96k 立体声约 44 分钟占满 30MB 上限。
        music:
          bitrate: 96k
          channels: 2

