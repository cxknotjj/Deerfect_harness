# CI 三件套：后端构建+测试（含 Flyway 迁移校验）、前端类型检查/构建/单测、前端 E2E 冒烟（mock）。
#
# 分支保护（需仓库管理员在 GitHub/Gitee 设置里勾选，CLI 无法自动完成）：
#   Settings → Branches → Add branch protection rule（或 Ruleset）
#   - Branch name pattern: master
#   - 勾选 Require a pull request before merging
#   - 勾选 Require status checks to pass before merging，并选中下面三个 job：
#     backend / web / e2e
#   - 勾选 Require branches to be up to date before merging
# Gitee（企业版可用「保护分支」设置）同理：保护 master 并要求流水线（Jenkins 等）通过后合并。

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # 主库 MySQL：Spring 上下文测试启动时会执行 Flyway 全量迁移（等价于迁移校验），
    # 迁移文件校验失败或与已发布版本冲突会直接让本 job 失败。
    # pgvector 不启动：KnowledgeConfig 整链 @Lazy，首次检索才连接，测试不触发。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: harness
          MYSQL_DATABASE: harness
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pharness"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # 本地仓库改用默认 ~/.m2 以便命中 setup-java 的缓存；settings.xml 仍生效（阿里云镜像）
          cache: maven
      - name: Build & test
        run: mvn -s .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/harness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: harness

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # build 内含 vue-tsc --noEmit（类型检查），不再重复跑一遍
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # mock 模式（VITE_USE_MOCK=true 由 playwright.config.ts 的 webServer 注入），无需后端与数据库
      - name: Smoke tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
