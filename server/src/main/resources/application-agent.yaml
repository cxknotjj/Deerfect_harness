# ============================================================
# Agent 运行时：沙箱 / Prompt 装配 / 用户画像 / 观测清理
# 由 application.yaml 的 spring.config.import 引入，不依赖 profile 激活。
# ============================================================

app:
  # 容器沙箱 Docker daemon 地址（host:port 或 tcp://host:port）：
  # SDK 默认发现只认 DOCKER_HOST 环境变量与 unix socket（/var/run/docker.sock）；
  # WSL/远程 daemon 等无 socket 场景用此项直连 TCP（如 Windows 宿主机 Docker Desktop
  # 暴露的 2375；镜像网络下用 127.0.0.1，勿用 localhost——IPv6 解析会超时）。
  # 留空 = 走 SDK 默认发现；环境变量 DOCKER_HOST 优先级更高（docker-java 标准链）。
  sandbox:
    docker-host: "127.0.0.1:2375"
  # 工具 Schema 延迟加载（两段式工具暴露）：开启后请求级工具面轻量注入（名称+用途，schema 置空），
  # system 附工具索引段，模型经 expand_tool 元工具按需展开获取完整参数说明；
  # 关闭后回退全量注入现状（expand_tool 不注册）
  prompt:
    lazy-tools:
      enabled: true
    # skill 动态装配（Markdown 技能库）：扫描 dir 目录的 .md 技能文件（front-matter 声明
    # name/description/agents），system 注入「名称+描述」索引段，模型经 load_skill 元工具
    # 按需取完整正文；文件按 mtime 热重载（放入/修改下一请求生效，免重启）；
    # 关闭后 skill 段为空、load_skill 不注册
    skills:
      enabled: true
      dir: skills
  # 用户偏好画像（跨对话长期记忆）：后台定时扫描空闲会话，LLM 提炼偏好并合并进
  # 全局画像文件（Markdown 条目，全文注入 general/lead 的 system prompt 画像段）；
  # 关闭后画像服务与注入点均不装配，prompt 无画像段
  memory:
    profile-enabled: false                        # 总开关（UserProfileService / 注入点同开关装配）
    profile-file: user-profile/user-profile.md   # 画像文件（相对工作区顶层目录，容器整目录挂载避单文件 inode 陷阱）
    profile-scan-interval-ms: 900000           # 空闲会话扫描周期（5 分钟，fixedDelay 上一轮完成后间隔再跑，不堆叠）
    profile-idle-minutes: 30                     # 会话静默多久后视为可提炼（防活跃会话反复提取；存量会话不回溯）
    profile-max-chars: 4000                      # 画像合并后字符上限（超出尾截，控制常驻注入预算）
  # 观测表保留期清理（ObservabilityLogCleaner）：llm_call_log / tool_call_log 按 created_at
  # 分批删除过期行（V24 索引支撑，单批 1000 防长事务）。0 = 禁用清理（不删任何行）
  observability:
    retention-days: 90                           # 观测数据保留天数
    clean-cron: "0 0 3 * * ?"                    # 清理时刻（每日凌晨 3 点低峰期）
