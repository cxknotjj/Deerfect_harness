# QQ 渠道接入配置（NapCat / OneBot 11，channel/qq 垂直包）
#
# 本文件自 application.yaml 拆出（napcat 块独立维护），由 application.yaml 顶部的
# spring.config.import 显式引入——不依赖 profile 激活，随主配置一并加载。
#
# enabled=false 时整链不装配（无 /onebot/event 端点、无线程池、无出站客户端）。
# token/secret 支持环境变量覆盖（NAPCAT_API_TOKEN / NAPCAT_EVENT_SECRET）；
# api-token 默认值为联调 token，生产请注入环境变量。
napcat:
  enabled: true
  api-base-url: http://127.0.0.1:3000    # NapCat HTTP API（跨机调试用 ssh -L 3000 隧道）
  api-token: ${NAPCAT_API_TOKEN:napcat123}        # 与 onebot11 httpServers.token 一致
  # 机器人 QQ 号(自消息过滤 + 群聊 @ 判据):env 注入优先,原硬编码值保留为本地回退
  self-id: ${QQ_SELF_ID:3896564418}
  agent-id: 10                             # 空 = 默认 Agent；填 agent 表主键后该 agent 的 knowledge 绑定自动生效。
                                           # 注意：该值只在 QQ 会话首次建档时绑定一次，之后尊重会话绑定（/agent 可切换）
  event-secret: ${NAPCAT_EVENT_SECRET:}  # 与 onebot11 httpClients.token 一致；空 = 不校验上报签名
  # 单条消息聊天超时秒数：超时放弃回复且静默（后台任务跑完仍落会话记忆），
  # 防 LLM 卡死占满处理线程池；0 = 不限制
  chat-timeout-seconds: 120
  # 私聊白名单（QQ 号 CSV）：非空时仅名单内用户可私聊（防陌生人刷 LLM token）；
  # 空 = 不限制。群聊不受此名单约束（@ 触发 + 限频已防刷）
  private-allow-users: ""
  group-trigger:
    mode: at            # at=仅@机器人 | prefix=命令前缀 | all=全部响应
    prefix: "/ai"
    # mode=at 时，回复机器人消息（入站 reply 段命中机器人已发消息）是否也触发；默认 false
    reply-to-bot: false
  rate-limit:
    per-user-seconds: 10  # 同用户回复最小间隔（群聊防风控 + 私聊防刷）；0 = 不限制
  reply:
    max-length: 3000      # 仅渐进关闭时的整包分段上限；0 = 不分段
    split-chars: 40             # 渐进切分粒度（字）：块超过就按下一层边界继续切（段落 → 换行 → 。！？）
    progressive: true           # 段落渐进发送：按上述粒度逐条弹出（像人连发）；false = 整包一次发（原行为）
    inter-chunk-delay-ms: 1200  # 动态条间延迟基础值（毫秒）：实际延迟 = 基础值 + 字数 × delay-factor + 随机扰动
    delay-factor: 0.1           # 动态延迟字数系数（秒/字）：0.1 = 每字停 100ms，模拟打字节奏；0 = 只用基础值
    jitter-range-ms: 200        # 动态延迟随机扰动（±毫秒）：叠加在基础值+字数延迟上，避免机械等间隔
    max-delay-ms: 10000         # 动态延迟上限（毫秒）：防超长块（无标点长文/合并尾条）算出分钟级停顿；0 = 不设上限
    max-chunks: 4               # 渐进单次回复最多拆几条，超出部分合并为最后一条；0 = 不限制
    at-asker: false             # 群聊回复首条是否 @ 提问者（防刷屏）；默认 false
  # 撤回行为：/recall 指令撤回机器人上一条消息；发送失败自动清理已发分片
  recall:
    auto-cleanup-enabled: true  # 回复分片中途发送失败时自动撤回本次已发分片（防群里留半截回答）；默认 true
  # 表情包发送（行为开关只放这里；情绪-表情映射表在 channel/emoji-index.json，不放 yaml）：
  # 回复每条 chunk 发送完成后按关键词/句尾符号命中自动追加表情图片，模拟真人甩表情
  emoji:
    enabled: true               # 总开关；false 时整个模块零行为（不读映射文件/目录、不检测、不发送）
    dir: channel/emojis         # 表情包根目录（相对启动工作目录，支持绝对路径）；图片需自行放置，不进 git
    index-file: channel/emoji-index.json  # 情绪-表情映射表 JSON（表情名 → {path, tags}）；缺失/损坏按空映射降级
    max-per-reply: 1            # 单次回复最多发送张数；0 = 不限制
    probability: 1.0            # 命中后发送概率（0.0~1.0）；1.0 = 必发，0 = 从不发送
    send-delay-ms: 800          # 表情发送前停顿毫秒数（模拟「找图」节奏）；0 = 不等待
    cheer-emoji: happy_01       # 句尾 ~ / ！ / ! 兜底触发的默认表情名（须为映射表中已有的表情名）
