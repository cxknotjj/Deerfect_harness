# ============================================================
# 主数据源与 Flyway：MySQL 业务库、schema 版本化迁移
# 由 application.yaml 的 spring.config.import 引入，不依赖 profile 激活。
# ============================================================

spring:
  datasource:
    # useSSL 可配：本地默认关闭，公网/生产必须开（MYSQL_USE_SSL=true），否则口令与业务数据明文过网
    url: jdbc:mysql://localhost:3306/harness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}
    # 账号同理走环境变量：默认 root 只服务于本机开发，生产用 MYSQL_USERNAME 覆盖为专用账号
    username: ${MYSQL_USERNAME:root}
    # 本地默认空密码;生产/公网部署务必经 MYSQL_PASSWORD 环境变量注入强密码
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 显式声明 UTF-8：迁移文件统一按 UTF-8 解析，防止系统默认编码（Windows GBK）介入导致中文注释乱码
    encoding: UTF-8
    # 存量库（表已存在但无 flyway_schema_history）首次接入时先打基线：
    # baseline 版本=1，V1 跳过，从 V2 起执行增量；全新空库则 V1 起完整执行
    baseline-on-migrate: true
