# ============================================================
# 应用配置入口：只保留启动骨架与各域配置的 import 清单。
# 分域文件（键区间互不重叠，改动请保持单一归属）：
#   application-ai.yaml          spring.ai.* / app.providers.*
#   application-datasource.yaml  spring.datasource / spring.flyway
#   application-chat.yaml        app.session / app.context / app.chat
#   application-agent.yaml       app.sandbox / app.prompt / app.memory / app.observability
#   application-security.yaml    app.security
#   application-knowledge.yaml   spring.servlet.multipart / app.knowledge
#   application-qq.yaml          napcat.*（QQ 渠道）
# ============================================================

spring:
  application:
    name: javaHarness
  # 按域导入，不依赖 profile 激活。注意：导入文件中的键优先级高于本文件，
  # 因此各域文件必须保持键区间互不重叠（唯一归属）。
  config:
    import:
      - classpath:application-ai.yaml
      - classpath:application-datasource.yaml
      - classpath:application-chat.yaml
      - classpath:application-agent.yaml
      - classpath:application-security.yaml
      - classpath:application-knowledge.yaml
      - classpath:application-qq.yaml

server:
  port: 8080

# 运行基线观测（Actuator + Micrometer）：指标从 /actuator/prometheus 抓取，
# 健康检查 /actuator/health（probes 供容器编排区分存活/就绪）。
# 指标清单与 PromQL 见 docs/dev.md「运行观测」；不暴露其他端点（env/heapdump 等含敏感信息）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # 结构化 JSON 日志（logstash 编码）：采集端按字段检索，不再用正则解析文本；
  # MDC 中的 traceId（TraceIdFilter 写入）随每条日志自动输出。本地想读文本日志时
  # 启动加 --logging.structured.format.console=（留空即恢复默认 pattern）
  structured:
    format:
      console: logstash
  level:
    root: info
    # 流式链路上 6 个聚合器(ChatClient 观测层/4 个 advisor 层/模型层)对同一次失败
    # 各打一条 ERROR 全堆栈，压掉——排错现场不丢：LlmRetry/AgentChatCaller 在首次
    # 失败时已带全量堆栈记录（含 agent/model 上下文），台账照记
    org.springframework.ai.chat.model.MessageAggregator: OFF
    # Tavily MCP streamable 端点不支持 GET SSE 监听流(返回 405),SDK LifecycleInitializer
    # 每次连接重建都会 WARN 全堆栈——该 405 为预期行为(POST 请求-响应路径不受影响,
    # SDK 自行按请求-响应模式工作),压到 ERROR 滤掉预期噪音
    io.modelcontextprotocol.client.LifecycleInitializer: ERROR
