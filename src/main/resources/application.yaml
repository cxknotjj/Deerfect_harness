spring:
  application:
    name: javaHarness
  ai:
    openai:
      # 通义千问 DashScope 的 OpenAI 兼容模式
      # （Spring AI 会自动在此 base-url 后拼接 /v1/chat/completions）
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 占位 key：保证无真实 key 也能启动；真实调用需配置环境变量 QWEN_API_KEY
      api-key: ${QWEN_API_KEY:dummy-key-for-startup}
      chat:
        options:
          # 可选 qwen3.7-flash / qwen-turbo / qwen-plus / qwen-max
          model: qwen3.7-flash
          temperature: 0.7
    mcp:
      # 自建 MCP Server（Streamable-HTTP，WebMVC 传输）：protocol 必须显式置为 STREAMABLE
      # 才会注册 /mcp 端点（默认是 SSE，端点不在 /mcp）。暴露 McpServerTools 的 3 个演示工具。
      server:
        enabled: true
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
      # 客户端：默认关闭 autoconfig 的 MCP client 自动装配，避免启动时强连外部 MCP Server
      # （连接失败会拖垮整个应用启动）。MCP client 由 McpToolProvider 懒连接 + 失败降级，
      # 首次被 agent 取用工具时才连接（server 与 client 同进程，启动完成后 /mcp 端点即可达）。
      client:
        enabled: false
        # 传输方式：http=Streamable-HTTP 连 server-url；stdio=spawn 外部 MCP 进程（见 stdio-command）
        transport: stdio
        # 懒连接时的 server 地址（http 模式），由 McpToolProvider 读取
        server-url: http://localhost:${server.port:8080}/mcp
        # 多 server 配置（McpToolProvider）：优先读项目根 mcp-config.json（mcpServers JSON 结构，
        # 同 Claude/Cursor）的全量条目——command(±args)=stdio、url=http、enabled:false 跳过，
        # 每 server 独立懒连接、失败按 server 隔离；文件缺失/无有效条目回退本节 legacy 单 server：
        # stdio 走 mcp-config.json 第一条目 → 此内联命令（回退），http 走上方 server-url。
        # 示例：stdio-command: "npx -y @browsermcp/mcp@latest"
        stdio-command: ""
  datasource:
    url: jdbc:mysql://localhost:3306/harness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 显式声明 UTF-8：迁移文件统一按 UTF-8 解析，防止系统默认编码（Windows GBK）介入导致中文注释乱码
    encoding: UTF-8
    # 存量库（表已存在但无 flyway_schema_history）首次接入时先打基线：
    # baseline 版本=1，V1 跳过，从 V2 起执行增量；全新空库则 V1 起完整执行
    baseline-on-migrate: true
  servlet:
    multipart:
      # 知识文档上传上限（POST /api/knowledge/upload，仅 .md/.txt）；单请求=单文件所以两项一致
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: 8080

# 多服务商 API Key 配置（敏感信息不落库；端点 url 以 model_provider 表为准，此处只管 key）。
# 解析规则：app.providers.<provider>.api-key 优先，未配置时回退环境变量 <PROVIDER大写>_API_KEY。
# 因此新增供应商通常零配置——设置 MOONSHOT_API_KEY 之类的环境变量即可。
app:
  # 上下文预算（token，全项目统一口径 TokenEstimator）：输入侧四层预算 + 消费侧预算
  # （输出 maxTokens 分档 / 编排全程消费上限），详见 docs/guides/context-optimization.md。
  # 本块是全部预算数值的唯一来源（代码零默认，只做绑定载体）；全键统一 0 = 不限制
  # （该层预算关闭，行为等同无预算），暂时不需要某项限制时置 0 即可
  context:
    history-budget: 4000      # 路径 A 会话历史裁剪（ContextAssemblingAdvisor）
    lead-budget: 4000         # 编排 lead 拆解 prompt（超出对目标文本尾截）
    aggregate-budget: 12000   # 编排聚合 prompt（超出按子任务等份额截断）
    tool-result-budget: 5000  # 单次调用工具结果注入上下文的总预算
    tool-call-limit: 8       # 单次调用工具执行次数硬上限
    # —— 消费侧：输出封顶（生成侧防失控，设 maxTokens，0 = 不限制）——
    max-tokens-lead: 2000     # lead 拆解单次输出上限（JSON 中间产物，本就该短）
    max-tokens-final: 8000    # 聚合与路径 A 直出单次输出上限（直出用户的最终回答）
    max-tokens-expert: 4000   # 编排子任务专家单次输出上限
    # —— 消费侧：编排全程消费上限（0 = 不限制）——
    orchestration-budget: 60000 # 单次编排全程 token 消费上限：内存账本同步累计（真实 usage 优先），
                                # 每轮 LLM 调用（含单次 call 内部工具循环）前经 caller 熔断检查，超限断流，
                                # 剩余子任务写「预算超限跳过」占位，聚合照常执行并在 prompt 注入降级说明
    # —— 消费侧：编排子任务并行限并发（0 = 不限并发，全部并行）——
    subtask-concurrency: 2    # 子任务并行扇出经信号量排队错峰执行：收敛下游 LLM 并发压力，
                              # 并把熔断后的在途超额窗口从「整批」收窄到「至多 N 个在途调用」
  # 聊天并发与超时（过载保护）：
  chat:
    # 流式连接数上限：/api/chat/stream 与 /api/chat/resume 的活跃 SSE 流计数（超限 429）；
    # 0 = 不限制（与预算口径一致）
    max-stream-connections: 50
    # LLM 调用超时（秒）：connect/read 作用于阻塞通道（call，防端点无响应永久挂起）；
    # stream-idle 作用于流式通道（AgentChatCaller 的 Flux.timeout 兜底，JDK 连接器无响应级超时）。
    # 未配置键回退代码兜底默认（10/300/120），行为与历史硬编码一致
    timeouts:
      connect-timeout-seconds: 10
      read-timeout-seconds: 300
      stream-idle-timeout-seconds: 120
    # COMPLEX 编排失败降级：编排自身失败（非客户端断开）时降级为会话绑定 Agent 单模型重答一次
    # （一层兜底不递归；重答失败保留「编排失败 + 重答失败」两段错误信息）
    complex-fallback:
      enabled: true
  # 工具 Schema 延迟加载（两段式工具暴露）：开启后请求级工具面轻量注入（名称+用途，schema 置空），
  # system 附工具索引段，模型经 expand_tool 元工具按需展开获取完整参数说明；
  # 关闭后回退全量注入现状（expand_tool 不注册）
  prompt:
    lazy-tools:
      enabled: true
    # skill 动态装配（Markdown 技能库）：扫描 dir 目录的 .md 技能文件（front-matter 声明
    # name/description/agents），system 注入「名称+描述」索引段，模型经 load_skill 元工具
    # 按需取完整正文；文件按 mtime 热重载（放入/修改下一请求生效，免重启）；
    # 关闭后 skill 段为空、load_skill 不注册
    skills:
      enabled: true
      dir: skills
  providers:
    dashscope:
      api-key: ${QWEN_API_KEY:dummy-key-for-startup}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:dummy-deepseek-key}
  # RAG 知识库（pgvector + DashScope 嵌入）：knowledge/ 目录的 .md/.txt 文档经
  # POST /api/knowledge/sync 增量摄取（切分→嵌入→入向量库），路径 A/B 每次调用前
  # 按当前 user 文本检索、注入 system 知识段，回答带【出处N】引用 + meta.sources。
  # PostgreSQL 不可用时检索静默降级为空（应用照常启动，对齐沙箱降级先例）
  knowledge:
    enabled: true
    dir: knowledge
    # 检索条数与相似度阈值（0~1，越大越严）
    top-k: 4
    min-score: 0.5
    # 注入 prompt 的知识片段总预算（token，口径同 tool-result-budget）
    context-budget: 3000
    # 触发检索的最短 user 文本长度（过短问题检索意义小，直接跳过）
    min-query-chars: 8
    # 启动时自动增量摄取（默认关：摄取要调嵌入 API，离线启动不应报错）
    auto-sync-on-startup: false
    # 目录监听自动摄取（WatchService 监听知识目录变更，静默期后自动 sync；默认关）
    watch-enabled: false
    # 文件事件静默期（秒）：事件停止后等待该时长再触发 sync，批量拷贝/原子写合并为一次
    watch-debounce-seconds: 3
    # BM25 混合检索（向量 + BM25 双路 RRF 融合重排，关键词/编号类查询召回更好；默认关 = 纯向量）
    hybrid-enabled: true
    # BM25 内存索引规模护栏：chunk 总数超过则不建索引、退化为纯向量；0 = 不限
    bm25-max-chunks: 20000
    # 单次嵌入请求 chunk 数上限（DashScope 兼容模式单请求硬上限 10 条文本，8 留余量；
    # 0 = 不分批一次性提交——大文档切出大量 chunk 时会撞批次上限 400）
    embed-batch-size: 8
    embedding:
      # OpenAI 兼容嵌入端点；key 解析同 ChatClientFactory（下方 api-key 优先，
      # 空则回退环境变量 QWEN_API_KEY）
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      model: text-embedding-v4
      # 建库维度：PgVectorStore 按此建 vector 列；更换嵌入模型/维度需删除向量表重建
      dimensions: 1024
    pgvector:
      # 知识库专用 PostgreSQL（与业务主库 MySQL 相互独立）；库需预先创建并启用 vector 扩展
      # （超级用户执行 CREATE EXTENSION vector；initializeSchema 只建表不建扩展）
      url: jdbc:postgresql://localhost:5432/postgres
      username: postgres
      password: "postgresql"
      # 向量表名（initializeSchema 按此自建；与库内其他项目的向量表隔离）
      table-name: vector_store_harness

# QQ 渠道接入（NapCat / OneBot 11，channel/qq 垂直包）：enabled=false 时整链不装配
# （无 /onebot/event 端点、无线程池、无出站客户端）。token/secret 支持环境变量覆盖
# （NAPCAT_API_TOKEN / NAPCAT_EVENT_SECRET）；api-token 默认值为联调 token，生产请注入环境变量。
napcat:
  enabled: true
  api-base-url: http://127.0.0.1:3000    # NapCat HTTP API（跨机调试用 ssh -L 3000 隧道）
  api-token: ${NAPCAT_API_TOKEN:napcat123}        # 与 onebot11 httpServers.token 一致
  self-id: "3896564418"                  # 机器人 QQ 号（自消息过滤 + 群聊 @ 判据）
  agent-id: 10                             # 空 = 默认 Agent；填 agent 表主键后该 agent 的 knowledge 绑定自动生效
  event-secret: ${NAPCAT_EVENT_SECRET:}  # 与 onebot11 httpClients.token 一致；空 = 不校验上报签名
  # 单条消息聊天超时秒数：超时放弃回复且静默（后台任务跑完仍落会话记忆），
  # 防 LLM 卡死占满处理线程池；0 = 不限制
  chat-timeout-seconds: 120
  # 私聊白名单（QQ 号 CSV）：非空时仅名单内用户可私聊（防陌生人刷 LLM token）；
  # 空 = 不限制。群聊不受此名单约束（@ 触发 + 限频已防刷）
  private-allow-users: ""
  group-trigger:
    mode: at            # at=仅@机器人 | prefix=命令前缀 | all=全部响应
    prefix: "/ai"
  rate-limit:
    per-user-seconds: 10  # 同用户回复最小间隔（群聊防风控 + 私聊防刷）；0 = 不限制
  reply:
    max-length: 3000      # 仅渐进关闭时的整包分段上限；0 = 不分段
    split-chars: 40             # 渐进切分粒度（字）：块超过就按下一层边界继续切（段落 → 换行 → 。！？）
    progressive: true           # 段落渐进发送：按上述粒度逐条弹出（像人连发）；false = 整包一次发（原行为）
    inter-chunk-delay-ms: 1200  # 动态条间延迟基础值（毫秒）：实际延迟 = 基础值 + 字数 × delay-factor + 随机扰动
    delay-factor: 0.1           # 动态延迟字数系数（秒/字）：0.1 = 每字停 100ms，模拟打字节奏；0 = 只用基础值
    jitter-range-ms: 200        # 动态延迟随机扰动（±毫秒）：叠加在基础值+字数延迟上，避免机械等间隔
    max-delay-ms: 10000         # 动态延迟上限（毫秒）：防超长块（无标点长文/合并尾条）算出分钟级停顿；0 = 不设上限
    max-chunks: 4               # 渐进单次回复最多拆几条，超出部分合并为最后一条；0 = 不限制
  # 表情包发送（行为开关只放这里；情绪-表情映射表在 channel/emoji-index.json，不放 yaml）：
  # 回复每条 chunk 发送完成后按关键词/句尾符号命中自动追加表情图片，模拟真人甩表情
  emoji:
    enabled: true               # 总开关；false 时整个模块零行为（不读映射文件/目录、不检测、不发送）
    dir: channel/emojis         # 表情包根目录（相对启动工作目录，支持绝对路径）；图片需自行放置，不进 git
    index-file: channel/emoji-index.json  # 情绪-表情映射表 JSON（表情名 → {path, tags}）；缺失/损坏按空映射降级
    max-per-reply: 1            # 单次回复最多发送张数；0 = 不限制
    probability: 1.0            # 命中后发送概率（0.0~1.0）；1.0 = 必发，0 = 从不发送
    send-delay-ms: 800          # 表情发送前停顿毫秒数（模拟「找图」节奏）；0 = 不等待
    cheer-emoji: happy_01       # 句尾 ~ / ！ / ! 兜底触发的默认表情名（须为映射表中已有的表情名）

logging:
  level:
    root: info
    # 无 API key 时 Spring AI 重试器会打整屏堆栈，压掉（失败信息由 AgentService 紧凑记录）
    org.springframework.ai.retry: ERROR
