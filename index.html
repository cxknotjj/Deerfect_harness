      rel="stylesheet"
    />
    <!-- 主题在首帧前确定，避免闪烁：localStorage 优先，其次跟随系统 -->
    <script>
      ;(() => {
        try {
          var saved = localStorage.getItem('dh-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* 隐私模式下 localStorage 不可用时保持默认亮色 */
        }
      })()
    </script>
