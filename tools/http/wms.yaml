# WMS 只读查询 —— 声明式 HTTP 工具。
#
# 为什么是一个工具 + 二十个资源，而不是二十个工具：
# 二十个近义工具名会让模型在选工具这一步就出错；收敛成 wms_query 后，
# 「查什么」变成 resource 枚举，「怎么查」交给 skill 说明书。
#
# 只读保证：本文件只收录 GET 端点；写操作、导出、打印、/ai/* 一律不得加入。
# 路径是唯一可信来源——模型只能选资源与参数值，不能拼路径。

pack: wms.query
base-url: ${WMS_API_BASE:}
auth:
  header: ${WMS_TOKEN_HEADER:X-Access-Token}
  token-env: WMS_API_TOKEN          # 只写变量名，凭据不落配置文件
timeout-ms: 15000

response:
  format: jeecg                     # 拆 result 包装：records 分页 / 数组 / 单对象
  drop-fields: [createBy, createTime, updateBy, updateTime, sysOrgCode]
  max-chars: 6000

tool:
  name: wms_query
  description: >-
    查询 WMS 仓储只读数据的唯一入口。resource 决定查什么（库存/商品/出入库单/发运/仓库网络/作业任务），
    params 传过滤条件与分页（pageNo/pageSize，服务端上限 20）。
    各 resource 支持的参数与查询套路见 skill「wms」——不确定时先读它，不要猜参数。
  resource-param: resource
  params-param: params

resources:
  # ---------- 库存 ----------
  stock:
    path: /inventory/wmsInventory/list
    summary: 库存查询
    # 注意：WMS 库存接口只认 productId。只有商品名时先查 resource=product 换 id。
    params: [productId, locationCode, batchNumber, containerCode, pageNo, pageSize]

  # ---------- 商品 ----------
  product:
    path: /goods/wmsProducts/list
    summary: 商品检索（名称/编码/条码/品牌/货主）
    params: [productName, productCode, productBarcode, productBrand, ownerId, pageNo, pageSize]
  product_detail:
    path: /goods/wmsProducts/queryById
    summary: 商品详情
    params: [id]
    requires: [id]

  # ---------- 入库单 ----------
  stock_in_order:
    path: /inorder/wmsStockInOrders/list
    summary: 入库单检索
    params: [orderNumber, orderType, status, expectedArrivalTime, pageNo, pageSize]
  stock_in_order_detail:
    path: /inorder/wmsStockInOrders/queryById
    summary: 入库单主表详情
    params: [id]
    requires: [id]
  stock_in_order_items:
    path: /inorder/wmsStockInOrders/queryWmsStockInOrderItemsByMainId
    summary: 入库单明细
    params: [id]
    requires: [id]

  # ---------- 出库单 ----------
  out_order:
    path: /outorder/wmsOutOrders/list
    summary: 出库单检索
    params: [orderNo, orderType, status, warehouseId, ownerId, pageNo, pageSize]
  out_order_detail:
    path: /outorder/wmsOutOrders/queryById
    summary: 出库单主表详情
    params: [id]
    requires: [id]
  out_order_items:
    path: /outorder/wmsOutOrders/queryWmsOutOrdersItemsByMainId
    summary: 出库单明细
    params: [id]
    requires: [id]
  out_order_allocations:
    path: /outorder/wmsOutOrders/queryWmsOutOrdersAllocationByMainId
    summary: 出库单分配明细
    params: [id]
    requires: [id]

  # ---------- 发运 ----------
  shipment:
    path: /shipment/wmsShipment/list
    summary: 发运单检索（发运号/运单号/关联出库单号）
    params: [shipmentNo, trackingNo, orderNo, status, pageNo, pageSize]
  shipment_detail:
    path: /shipment/wmsShipment/queryWmsShipmentDetailByMainId
    summary: 发运单明细
    params: [id]
    requires: [id]

  # ---------- 仓库网络 ----------
  warehouse:
    path: /warehouse/wmsWarehouses/list
    summary: 仓库列表
    params: [code, name, status, pageNo, pageSize]
  storage_zone:
    path: /warehouse/wmsStorageZones/list
    summary: 库区列表（可按上级仓库过滤）
    params: [code, name, warehouseId, status, pageNo, pageSize]
  storage_location:
    path: /warehouse/wmsStorageLocations/list
    summary: 库位列表（可按上级仓库/库区过滤）
    params: [code, warehouseId, zoneId, status, pageNo, pageSize]

  # ---------- 作业任务 ----------
  receive_task:
    path: /inorder/receiveTasks/list
    summary: 收货任务
    params: [taskNumber, status, productId, pageNo, pageSize]
    fixed: { taskType: RECEIVE_TASK }     # jeecg 字典枚举，模型不需要知道
  putaway_task:
    path: /inorder/putawayTasks/list
    summary: 上架任务
    params: [taskNumber, status, productId, pageNo, pageSize]
    fixed: { taskType: PUTAWAY_TASK }
  picking_task:
    path: /wave/pickingTasks/list
    summary: 拣货任务
    params: [taskNumber, status, productId, pageNo, pageSize]
    fixed: { taskType: PICKING_TASK }
  wave:
    path: /wave/wmsWaveMaster/list
    summary: 波次主表
    params: [waveNo, status, pageNo, pageSize]
  shortage:
    path: /wave/wmsShortageRegistration/list
    summary: 缺货登记
    params: [status, productId, pageNo, pageSize]
