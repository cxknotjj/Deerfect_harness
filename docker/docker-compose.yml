# ============================================================
# java-harness 三件套：app + MySQL 8.4（主库/Flyway）+ pgvector（RAG 知识库）
#
# 运行（在项目根）：
#   QWEN_API_KEY=sk-xxx docker compose -f docker/docker-compose.yml up -d --build
#   或：cd docker && QWEN_API_KEY=sk-xxx docker compose up -d --build
#
# 敏感项走 .env 或 shell 环境变量，勿写死在本文件：
#   QWEN_API_KEY / DEEPSEEK_API_KEY   LLM 供应商 key
#   NAPCAT_API_TOKEN / NAPCAT_EVENT_SECRET  QQ 渠道令牌
#   MYSQL_ROOT_PASSWORD / PGVECTOR_PASSWORD  两库口令
#   NAPCAT_BASE_URL / NAPCAT_ENABLED  NapCat 地址与总开关
# ============================================================
name: java-harness

services:
  mysql:
    image: mysql:8.4
    container_name: harness-mysql
    # 宿主机内存只有 1.8G，压低 InnoDB 缓冲池与连接数，防止 mysqld 被 OOM killer 击杀
    command:
      - "--innodb-buffer-pool-size=96M"
      - "--max-connections=60"
      - "--performance-schema=OFF"
    # 数据库绝不能被全局 OOM 杀：低 oom_score + 硬上限兜底
    oom_score_adj: -500
    mem_limit: 300m
    environment:
      MYSQL_DATABASE: harness
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"          # 宿主机管理工具直连用；不需要可删除
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: harness-pgvector
    environment:
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-postgresql}
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 首次建库时由官方入口脚本执行：预装 vector 扩展（应用侧只建表不建扩展）
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"          # 宿主机 5432 已被占用时删除此行（容器间走服务名直连）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    oom_score_adj: -500
    mem_limit: 256m

  app:
    build:
      # context 必须是项目根（Dockerfile 的 COPY 依赖 pom/src/skills 等）
      context: ..
      dockerfile: docker/Dockerfile
      # Docker Hub 不可达时设环境变量切加速通道，如：
      #   BUILD_BASE=docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-17
      #   RUN_BASE=docker.m.daocloud.io/library/eclipse-temurin:17-jre
      args:
        BUILD_BASE: ${BUILD_BASE:-maven:3.9-eclipse-temurin-17}
        RUN_BASE: ${RUN_BASE:-eclipse-temurin:17-jre}
    # 复用手工 docker build 的同名镜像（否则 compose 默认找 java-harness-app 会强制重建）
    image: java-harness
    container_name: java-harness
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    ports:
      - "8080:8080"
    # 全局 OOM 时先牺牲 napcat 的 qq(adj=200) 再轮到本服务(adj=100)，别再连累 mysql
    oom_score_adj: 100
    mem_limit: 600m
    # 1.8G 小内存机：全局 OOM 可能仍会杀到本服务（JVM total_vm 最大），
    # 被杀后自动拉起；mysql/pg 有 adj=-500 保护不受影响
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 1.8G 小内存机器：收紧 JVM（堆/元空间/线程栈/直接内存/代码缓存），
      # 降低 RSS 和 total_vm，避免成为全局 OOM killer 的首选目标
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m"
      # —— 主库：连 compose 内 mysql（env 覆盖 yaml 的 localhost 硬编码）——
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/harness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-harness123}
      # —— 知识库：连 compose 内 pgvector ——
      APP_KNOWLEDGE_PGVECTOR_URL: jdbc:postgresql://pgvector:5432/postgres
      APP_KNOWLEDGE_PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-postgresql}
      # —— LLM 供应商 key（yaml 已参数化，未配置也能启动、真实调用需真实 key）——
      QWEN_API_KEY: ${QWEN_API_KEY:-dummy-key-for-startup}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-dummy-deepseek-key}
      NAPCAT_API_TOKEN: ${NAPCAT_API_TOKEN:-napcat123}
      NAPCAT_EVENT_SECRET: ${NAPCAT_EVENT_SECRET:-}
    volumes:
      # 沙箱工具（DooD）：应用经宿主 Docker 守护进程拉起沙箱容器。
      # 沙箱在容器内默认走 unix socket 标准发现，无需配 DOCKER_HOST；
      # 不需要沙箱可删除此行（启动打 warn，其余功能不受影响）
      - /var/run/docker.sock:/var/run/docker.sock
      # 知识库/技能文档（免重打镜像改内容）：目录挂载实时可见，
      # knowledge 改完调 POST /api/knowledge/sync 增量摄取（mtime 对比，免重启）
      - ../knowledge:/workspace/knowledge:ro
      - ../skills:/workspace/skills:ro
      # 表情映射表 + 图片（图片不进 git/.dockerignore 已排除，index 改后 restart app）
      - ../channel:/workspace/channel:ro
      # 用户偏好画像（跨对话长期记忆，app 可写）：UserProfileService 定时合并写入 +
      # prompt 画像段全文读取；整目录挂载防单文件 inode 陷阱（原子替换产生新 inode 后
      # 容器内旧文件挂载失效）；首次部署宿主目录可不存在（docker 自动创建，服务首写落盘）
      - ../user-profile:/workspace/user-profile
      # MCP server 配置（不进 git，含 API key）：McpToolProvider 启动时读一次，
      # 改后需 up -d --force-recreate app（或 cat > 覆盖写保 inode 后 restart）
      - ../mcp-config.json:/workspace/mcp-config.json:ro
      # 批量覆盖 jar 内 yaml 属性（无需重打镜像）：Spring Boot 默认扫描工作目录 ./config/，
      # 外置文件按键叠加在 jar 内 yaml 之上，只写要改的键、其余沿用默认值；改后 restart app：
      - ./config:/workspace/config:ro
    extra_hosts:
      # 容器内访问宿主机服务（如宿主 Docker 里的 NapCat）用 host.docker.internal
      - "host.docker.internal:host-gateway"
    # 命令行参数覆盖 yaml（最高优先级）：NapCat 在宿主 Docker 默认网桥且已发布 3000 时
    # 走 host-gateway；NapCat 在远端机器则设 NAPCAT_BASE_URL=http://<host>:3000
    command:
      - "--napcat.api-base-url=${NAPCAT_BASE_URL:-http://host.docker.internal:3000}"
      - "--napcat.enabled=${NAPCAT_ENABLED:-true}"

volumes:
  mysql-data:
  pg-data:
